<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            padding-top: 70px; /* Отступ сверху для navbar */
            background-color: #f8f9fa;
        }
        .sidebar {
            height: 100vh;
            padding: 10px;
            background-color: #343a40;
        }
        .sidebar .btn {
            width: 100%;
            margin-bottom: 10px;
            text-align: left;
        }

        .btn-primary, .btn-secondary {
            background-color: #007bff;
            border: none;
        }
        .sidebar .btn-secondary {
            background-color: #6c757d;
        }
        .navbar-text {
            color: #adb5bd; /* Бледный текст */
        }
        .navbar .btn-logout {
            color: #808080;
            border: none;
            background: none;
        }
        .navbar .btn-logout:hover {
            color: #ffca2c;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
        <!-- Отображение логина и роли -->
        <span class="navbar-text me-auto">
            <strong th:text="${username}">Username</strong> with role: <span th:text="${userRole}">Role</span>
        </span>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button type="submit" class="btn btn-logout">Logout</button>
            </form>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 sidebar">
            <a href="/admin" class="btn btn-primary">Admin</a>
            <a href="/user" class="btn btn-secondary">User</a>
        </div>

        <!-- Content -->
        <div class="col-md-10">
            <h1 class="h3">About User</h1>

            <!-- Displaying only the current user data -->
            <table class="table table-striped table-bordered">
                <thead class="thead-dark">
                <tr>
                    <th>ID</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Email</th>
                    <th>Age</th>
                    <th>Role</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td th:text="${person.id}"></td>
                    <td th:text="${person.firstname}"></td>
                    <td th:text="${person.lastname}"></td>
                    <td th:text="${person.username}"></td>
                    <td th:text="${person.age}"></td>
                    <td th:text="${person.rolesAsString}"></td>
                </tr>
                </tbody>
            </table>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-oBqDVmMz4fnFO9xFzE0aoAA2gyNijTsmxt+ht5bKxS1lHt0mJ91DE3DO89zFexS8z" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-9ndC6V22m9u51NQv+gsytnSRaDQoMjsgyF4g6xP9HMXp2Y1thS2drAi0S5lbT5H2E" crossorigin="anonymous"></script>
</body>
</html>
