<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - User List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            padding-top: 70px; /* Отступ сверху для navbar */
            background-color: #f8f9fa;
        }
        .sidebar {
            height: 100vh;
            padding: 10px;
            background-color: #343a40;
        }
        .sidebar .btn {
            width: 100%;
            margin-bottom: 10px;
            text-align: left;
        }
        .btn-primary, .btn-secondary {
            background-color: #007bff;
            border: none;
        }
        .sidebar .btn-secondary {
            background-color: #6c757d;
        }
        .navbar-text {
            color: #adb5bd; /* Бледный текст */
        }
        .navbar .btn-logout {
            color: #ffc107;
            border: none;
            background: none;
        }
        .navbar .btn-logout:hover {
            color: #ffca2c;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
        <!-- Отображение логина и роли -->
        <span class="navbar-text me-auto">
            <strong th:text="${username}">Username</strong> with role: <span th:text="${userRole}">Role</span>
        </span>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button type="submit" class="btn btn-logout">Logout</button>
            </form>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 sidebar">
            <a href="/admin" class="btn btn-primary">Admin</a>
            <a href="/user" class="btn btn-secondary">User</a>
        </div>

        <!-- Content -->
        <div class="col-md-10">
            <h1 class="h3">Admin panel</h1>

            <table class="table table-striped table-bordered">
                <thead class="thead-dark">
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>email</th>
                    <th>age</th>
                    <th>Roles</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="person : ${persons}">
                    <td th:text="${person.id}"></td>
                    <td th:text="${person.username}"></td>
                    <td th:text="${person.email}" ></td>
                    <td th:text="${person.age}" ></td>
                    <td th:text="${person.rolesAsString}"></td>
                    <td class="actions">
                        <!-- Измените ссылку на редактирование -->
                        <button type="button" class="btn btn-primary btn-sm" data-bs-toggle="modal"
                                data-bs-target="#editPersonModal"
                                th:data-person-id="${person.id}"
                                th:data-person-username="${person.username}"
                                th:data-person-email="${person.email}"
                                th:data-person-age="${person.age}"
                                th:data-person-roles="${person.rolesAsString}">
                            Edit
                        </button>
                        <a th:href="@{/admin/delete/{id}(id=${person.id})}" class="btn btn-danger btn-sm">Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>

            <!-- Button to open create modal -->
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createPersonModal">
                Create Person
            </button>

            <!-- Modal for creating person -->
            <div class="modal fade" id="createPersonModal" tabindex="-1" aria-labelledby="createPersonModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="createPersonModalLabel">Create Person</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <!-- Form inside modal -->
                            <form th:action="@{/admin/save}" th:object="${person}" method="post">
                                <div th:if="${error}" class="alert alert-danger" role="alert">
                                    <span th:text="${error}"></span>
                                </div>

                                <div class="mb-3">
                                    <label for="username" class="form-label">Username:</label>
                                    <input type="text" id="username" th:field="*{username}" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email:</label>
                                    <input type="text" id="email" th:field="*{email}" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label for="age" class="form-label">Age:</label>
                                    <input type="text" id="age" th:field="*{age}" class="form-control" required>
                                </div>

                                <div class="mb-3">
                                    <label for="password" class="form-label">Password:</label>
                                    <input type="password" id="password" th:field="*{password}" class="form-control" required>
                                </div>

                                <div class="mb-3">
                                    <label for="role" class="form-label">Role:</label>
                                    <select id="role" name="roleId" class="form-select" required>
                                        <option th:each="role : ${roles}" th:value="${role.id}" th:text="${role.name}"></option>
                                    </select>
                                </div>

                                <button type="submit" class="btn btn-primary">Save</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Modal for editing person -->
            <div class="modal fade" id="editPersonModal" tabindex="-1" aria-labelledby="editPersonModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="editPersonModalLabel">Edit Person</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <!-- Form inside modal -->
                            <form id="editPersonForm" method="post">
                                <div class="alert alert-danger" id="editErrorMessage" style="display: none;">
                                    <span id="editErrorText"></span>
                                </div>

                                <div class="mb-3">
                                    <label for="editUsername" class="form-label">Username:</label>
                                    <input type="text" id="editUsername" name="username" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label for="editEmail" class="form-label">Email:</label>
                                    <input type="text" id="editEmail" name="email" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label for="editAge" class="form-label">Age:</label>
                                    <input type="text" id="editAge" name="age" class="form-control" required>
                                </div>

                                <div class="mb-3">
                                    <label for="editPassword" class="form-label">Password:</label>
                                    <input type="password" id="editPassword" name="password" class="form-control">
                                </div>

                                <div class="mb-3">
                                    <label for="editRole" class="form-label">Role:</label>
                                    <select id="editRole" name="roleId" class="form-select" required>
                                        <option th:each="role : ${roles}" th:value="${role.id}" th:text="${role.name}"></option>
                                    </select>
                                </div>

                                <button type="submit" class="btn btn-primary">Update</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const editPersonModal = document.getElementById('editPersonModal');
        editPersonModal.addEventListener('show.bs.modal', function(event) {
            const button = event.relatedTarget; // Кнопка, которая вызвала модальное окно
            const personId = button.getAttribute('data-person-id');
            const personUsername = button.getAttribute('data-person-username');
            const personEmail = button.getAttribute('data-person-email');
            const personAge = button.getAttribute('data-person-age');
            const personRoles = button.getAttribute('data-person-roles');

            // Заполнение полей формы
            const form = document.getElementById('editPersonForm');
            form.action = `/admin/update/${personId}`;
            document.getElementById('editUsername').value = personUsername;
            document.getElementById('editEmail').value = personEmail;
            document.getElementById('editAge').value = personAge;

            // Обработка выпадающего списка ролей
            const roleSelect = document.getElementById('editRole');
            // Установка выбранного значения на основе данных
            if (roleSelect) {
                Array.from(roleSelect.options).forEach(option => {
                    if (option.value === personRoles) {
                        option.selected = true;
                    }
                });
            }
        });
    });

</script>
</body>
</html>
