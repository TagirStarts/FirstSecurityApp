<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - User List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            padding-top: 70px; /* Отступ сверху для navbar */
            background-color: #f8f9fa;
        }
        .sidebar {
            height: 100vh;
            padding: 10px;
            background-color: #343a40;
        }
        .sidebar .btn {
            width: 100%;
            margin-bottom: 10px;
            text-align: left;
        }
        .btn-primary, .btn-secondary {
            background-color: #007bff;
            border: none;
        }
        .sidebar .btn-secondary {
            background-color: #6c757d;
        }
        .navbar-text {
            color: #adb5bd; /* Бледный текст */
        }
        .navbar .btn-logout {
            color: #ffc107;
            border: none;
            background: none;
        }
        .navbar .btn-logout:hover {
            color: #ffca2c;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
        <!-- Отображение логина и роли -->
        <span class="navbar-text me-auto">
            <strong th:text="${username}">Username</strong> with roles: <span th:text="${roles}">Role</span>
        </span>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button type="submit" class="btn btn-logout">Logout</button>
            </form>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 sidebar">
            <a href="/admin" class="btn btn-primary">Admin</a>
            <a href="/user" class="btn btn-secondary">User</a>
        </div>

        <!-- Content -->
        <div class="col-md-10">
            <h1 class="h3">User List</h1>

            <table class="table table-striped table-bordered">
                <thead class="thead-dark">
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Roles</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="person : ${persons}">
                    <td th:text="${person.id}"></td>
                    <td th:text="${person.username}"></td>
                    <td th:text="${person.rolesAsString}"></td>
                    <td class="actions">
                        <!-- Измените ссылку на редактирование -->
                        <a th:href="@{/admin/edit/{id}(id=${person.id})}" class="btn btn-primary btn-sm">Edit</a>
                        <a th:href="@{/admin/delete/{id}(id=${person.id})}" class="btn btn-danger btn-sm">Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>

            <div class="d-flex justify-content-between">
                <a href="/admin/create" class="btn btn-success">Create New Person</a>
                <a href="/admin" class="btn btn-secondary">Back to Home</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
