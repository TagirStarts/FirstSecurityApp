<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            padding-top: 70px; /* Отступ сверху для navbar */
            background-color: #f8f9fa;
        }
        .sidebar {
            height: 100vh;
            padding: 10px;
            background-color: #343a40;
        }
        .sidebar .btn {
            width: 100%;
            margin-bottom: 10px;
            text-align: left;
        }
        .btn-primary, .btn-secondary {
            background-color: #007bff;
            border: none;
        }
        .sidebar .btn-secondary {
            background-color: #6c757d;
        }
        .navbar-text {
            color: #FFFFFF; /* Бледный текст */
        }
        .navbar .btn-logout {
            color: #adb5bd;
            border: none;
            background: none;
        }
        .navbar .btn-logout:hover {
            color: #ffca2c;
        }
        /* New styles */
        .form-container {
            max-width: 100%;
            margin: 0;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 0;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .form-container h5 {
            margin-bottom: 20px;
        }
        .form-container label {
            display: block;
            margin: 0 0 5px 0; /* Отступ снизу для label */
            font-weight: bold; /* Жирный шрифт для label */
            text-align: center;
        }
        .form-container .form-control,
        .form-container .form-select {
            margin: 0 auto; /* Убрать отступы по бокам */
            text-align: center;
            width: 30%;
            padding: 5px 10px; /* Корректировка отступов внутри input/select */
        }
        .form-container .form-control {
            margin-bottom: 15px; /* Увеличенный отступ между полями */
            height: auto; /* Высота auto, так как размер автоматически подстраивается */
        }
        .form-container .form-select {
            margin-bottom: 10px; /* Увеличенный отступ между полями */
            height: auto; /* Высота auto, так как размер автоматически подстраивается */
        }
        .form-container .btn-primary {
            margin: 10px auto 0 auto;
            width: 15%;
            display: block;
            background-color: #008000;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
        <!-- Отображение логина и роли -->
        <span class="navbar-text me-auto">
            <strong th:text="${username}">Username</strong> with role: <span th:text="${userRole}">Role</span>
        </span>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button type="submit" class="btn btn-logout">Logout</button>
            </form>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 sidebar">
            <a href="/admin" class="btn btn-primary">Admin</a>
            <a href="/user" class="btn btn-secondary">User</a>
        </div>

        <!-- Content -->
        <div class="col-md-10">
            <h1 class="h3">Admin panel</h1>
            <div>
                <a href="/admin/create" class="btn btn-link" >
                    New user
                </a>
                <!-- Button to refresh or go to the same list -->
                <a href="/admin" class="btn btn-link">Users table</a>
            </div>

            <!-- Form to create a new user -->
            <div class="form-container">
                <h5>Add New User</h5>
                <form th:action="@{/admin/save}" th:object="${person}" method="post">
                    <div th:if="${error}" class="alert alert-danger" role="alert">
                        <span th:text="${error}"></span>
                    </div>

                    <label for="firstname">First Name:</label>
                    <input type="text" id="firstname" th:field="*{firstname}" class="form-control" placeholder="First Name" required>

                    <label for="lastname">Last Name:</label>
                    <input type="text" id="lastname" th:field="*{lastname}" class="form-control" placeholder="Last Name" required>

                    <label for="age">Age:</label>
                    <input type="text" id="age" th:field="*{age}" class="form-control" placeholder="Age" required>

                    <label for="username">Email:</label>
                    <input type="email" id="username" th:field="*{username}" class="form-control" placeholder="Email" required>

                    <label for="password">Password:</label>
                    <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="Password" required>

                    <label for="role">Role:</label>
                    <select id="role" name="roleId" class="form-select" required>
                        <option th:each="role : ${roles}" th:value="${role.id}" th:text="${role.name}"></option>
                    </select>

                    <button type="submit" class="btn btn-primary">Add new user</button>
                </form>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
