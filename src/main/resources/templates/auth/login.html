<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
            background-color: #f8f9fa;
            padding-top: 10vh; /* Отступ сверху */
        }

        .form-container {
            max-width: 400px;
            width: 100%;
        }

        h1 {
            text-align: left; /* Выровняем заголовок по левому краю */
            margin-bottom: 20px;
        }
        .form-control {
            width: 100%;
            padding: 10px;
        }
        .btn-primary, .btn-secondary {
            width: 100%;
            margin-top: 20px;
        }
        .login-link {
            text-align: center;
            margin-top: 15px;
            display: block;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h1 class="h3 mb-3 font-weight-normal">Please sign in</h1>
    <form th:action="@{/process_login}" method="post">
        <div class="form-group">
            <input type="text" id="username" name="username" class="form-control" placeholder="Enter your email" required autofocus>
        </div>
        <div class="form-group mt-3">
            <input type="password" id="password" name="password" class="form-control" placeholder="Password" required>
        </div>
        <button class="btn btn-primary btn-lg" type="submit">Sign in</button>
        <!-- Кнопка для перехода на страницу регистрации -->
        <a href="/auth/registration" class="btn btn-secondary btn-lg">Register</a>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
